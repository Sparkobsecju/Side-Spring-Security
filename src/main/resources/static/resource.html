<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資源頁面</title>
    <!--
        此檔案位於 static，因此不使用 th:* 或 sec:* 屬性；這些屬性只有放在 templates
        並經過 Thymeleaf View Resolver 時才會生效。GET /resource 必須先完成身分驗證。
    -->
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #1f2937;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
        }
        .card {
            width: min(100%, 520px);
            padding: 36px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 16px 38px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        h1 { color: #166534; }
        p { color: #64748b; line-height: 1.7; }
        .actions { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
        a, button {
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            background: #4f46e5;
        }
        button { background: #475569; }
        form { margin: 0; }
    </style>
</head>
<body>
<!-- 成功看到此內容，代表 SecurityFilterChain 已確認目前 Session 為登入狀態。 -->
<main class="card">
    <h1>受保護資源</h1>
    <p>您已通過 Spring Security 身分驗證，因此可以瀏覽這個頁面。</p>
    <div class="actions">
        <a href="/home">返回首頁</a>
        <form action="/logout" method="post">
            <button type="submit">登出</button>
        </form>
    </div>
</main>
</body>
</html>
