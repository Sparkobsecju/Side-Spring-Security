<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入頁面</title>
    <!--
        交接說明：
        1. GET /login 由 PageController 轉送到此靜態頁面。
        2. 表單必須以 POST 提交到 /login，欄位名稱必須維持 username 與 password，
           Spring Security 的 UsernamePasswordAuthenticationFilter 才能取得帳密。
        3. 專案目前停用 CSRF；正式環境重新啟用後，表單也必須加入 CSRF Token。
    -->
    <style>
        /* 全頁共用的尺寸計算方式，避免 padding 撐大表單元件。 */
        * {
            box-sizing: border-box;
        }

        /* 將登入卡片置於畫面中央，並提供柔和的品牌漸層背景。 */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #1f2937;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #eef2ff 50%, #f5f3ff 100%);
        }

        .login {
            width: 100%;
            max-width: 400px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 50px rgba(30, 64, 175, 0.14);
            backdrop-filter: blur(10px);
        }

        .login::before {
            display: block;
            margin-bottom: 28px;
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            content: "會員登入";
        }

        /* 登出成功後，由頁尾 JavaScript 根據 ?logout 顯示此訊息。 */
        .message {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #166534;
            font-size: 14px;
            background: #f0fdf4;
        }

        /* 使用者名稱與密碼共用的輸入框樣式。 */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            margin-bottom: 16px;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            color: #0f172a;
            font-size: 16px;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* 僅供螢幕閱讀器朗讀的標籤，兼顧無障礙與簡潔 UI。 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .submit {
            margin-top: 8px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 13px 20px;
            border: 0;
            border-radius: 9px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(90deg, #4f46e5, #2563eb);
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.24);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        input[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(79, 70, 229, 0.3);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .login {
                padding: 32px 24px;
            }
        }

    </style>
</head>
<body>
<!-- 登入表單卡片：登入失敗會由安全設定導向獨立的 /login-error 頁面。 -->
<main class="login">
    <div id="logout-message" class="message" role="status" hidden>您已安全登出</div>
    <form action="/login" method="post">
        <div>
            <label class="sr-only" for="username">使用者名稱</label>
            <input
                id="username"
                name="username"
                placeholder="請輸入使用者名稱"
                type="text"
                autocomplete="username"
                required />
            <label class="sr-only" for="password">密碼</label>
            <input
                id="password"
                name="password"
                placeholder="請輸入密碼"
                type="password"
                autocomplete="current-password"
                required />
        </div>
        <div class="submit">
            <input type="submit" value="登入" />
        </div>
    </form>
</main>
<script>
    // Spring Security 登出成功會導向 /login?logout；只有此時才顯示成功訊息。
    if (new URLSearchParams(window.location.search).has("logout")) {
        document.getElementById("logout-message").hidden = false;
    }
</script>
</body>
</html>
